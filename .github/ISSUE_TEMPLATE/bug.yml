name: Bug report
description: Something does not work as documented.
title: "fix: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not paste secrets, tokens or internal hostnames. Security problems go through private reporting (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including the exact error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands you ran, in order.
      render: powershell
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, PowerShell version, gh version.
      placeholder: Windows 11, PowerShell 7.6.7, gh 2.x
    validations:
      required: true
